name: release-please

# Reads Conventional Commits on `main` and maintains a "Release PR" that bumps
# the version (in steeper/__init__.py) and updates CHANGELOG.md. Merging that PR
# creates the git tag `vX.Y.Z`, which triggers publish.yml → PyPI.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
