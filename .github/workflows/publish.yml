name: Publish to PyPI

# Publishes on a version tag (e.g. `v0.2.0`). Uses PyPI Trusted Publishing
# (OIDC) — no API tokens stored in the repo. Configure the publisher once at
# https://pypi.org/manage/project/steeper/settings/publishing/ with:
#   owner = KarimovMurodilla, repo = steeper,
#   workflow = publish.yml, environment = pypi
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[all,test]"
      - name: Pytest
        run: pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import re, pathlib; \
            print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", \
            pathlib.Path("steeper/__init__.py").read_text()).group(1))')"
          echo "tag=$tag  package=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Git tag v$tag does not match steeper.__version__ ($version)"
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/steeper/
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
